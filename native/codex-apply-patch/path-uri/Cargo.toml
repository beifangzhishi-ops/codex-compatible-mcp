[package]
name = "codex-utils-path-uri"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
base64 = "0.22"
codex-utils-absolute-path = { path = "../../codex-utils-absolute-path" }
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ts-rs = { version = "11", features = ["no-serde-warnings"] }
url = "2"
urlencoding = "2"

[dev-dependencies]
pretty_assertions = "1"
serde_json = "1"
