[package]
name = "ccm-codex-apply-patch"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "codex_apply_patch"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "ccm-codex-apply-patch"
path = "src/bin/ccm-bridge.rs"

[[bin]]
name = "apply_patch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
codex-exec-server = { path = "exec-server" }
codex-utils-absolute-path = { path = "../codex-utils-absolute-path" }
codex-utils-path-uri = { path = "path-uri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "fs", "io-util"] }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"

[dev-dependencies]
assert_cmd = "2"
assert_matches = "1"
pretty_assertions = "1"
tempfile = "3"
