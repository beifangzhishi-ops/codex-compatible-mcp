[package]
name = "ccm-codex-execpolicy"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "codex_execpolicy"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "ccm-codex-execpolicy"
path = "src/main.rs"

[[bin]]
name = "ccm-codex-execpolicy-bridge"
path = "src/bin/ccm-bridge.rs"

[dependencies]
anyhow = "1"
caseless = "0.2.2"
clap = { version = "4", features = ["derive"] }
codex-utils-absolute-path = { path = "../codex-utils-absolute-path" }
multimap = "0.10.0"
serde = { version = "1", features = ["rc", "derive"] }
serde_json = "1"
shlex = "1.3.0"
starlark = { version = "0.14.2", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
pretty_assertions = "1.4.1"
