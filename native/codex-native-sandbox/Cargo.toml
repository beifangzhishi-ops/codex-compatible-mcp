[package]
name = "ccm-codex-native-sandbox"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "CCM's transport entrypoint into unmodified upstream Codex Windows sandbox"

[dependencies]
anyhow = "1"
codex-protocol = { path = "../../vendor/openai-codex/codex-rs/protocol" }
codex-utils-absolute-path = { path = "../../vendor/openai-codex/codex-rs/utils/absolute-path" }
codex-windows-sandbox = { path = "../../vendor/openai-codex/codex-rs/windows-sandbox-rs" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

# The upstream crate uses these patched crates in codex-rs/Cargo.toml.
# They must also be present at CCM's independent Cargo workspace root;
# path dependencies do not inherit a dependency workspace's [patch] table.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
