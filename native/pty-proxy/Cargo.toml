[package]
name = "ccm-pty-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"

[dependencies]
anyhow = "1"
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
filedescriptor = "0.8.3"
lazy_static = "1"
log = "0.4"
shared_library = "0.1.9"
tokio = { version = "1", features = ["process"] }
winapi = { version = "0.3.9", features = [
  "handleapi",
  "jobapi",
  "jobapi2",
  "libloaderapi",
  "minwinbase",
  "processthreadsapi",
  "synchapi",
  "winbase",
  "wincon",
  "winerror",
  "winnt",
] }
